name: Deploy to GitHub Pages

# Publishes the static site whenever main changes. Also runnable on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp cache-busting build id into index.html
        # Replace ?v=__BUILD__ with this commit's short SHA so every deploy
        # serves uniquely-named assets and browsers never show stale files.
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .            # the repo root is the site (static files)
      - id: deployment
        uses: actions/deploy-pages@v4
